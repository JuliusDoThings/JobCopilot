# Local development only. No host credentials or .env files are forwarded.
services:
  backend:
    build:
      context: ./backend
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", ".venv/bin/python", "-c", "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status == 200"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 6
  frontend:
    build:
      context: ./frontend
    init: true
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      JOB_COPILOT_DEV_BENCH: "1"
      JOB_COPILOT_BENCH_API_BASE: http://backend:8000
      FASTAPI_BASE_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6
